name: canora-build

# Builds a musl-static Linux x64 `turbo` from the pnpm-prune peer-variant
# fix branch (vercel/turborepo#12819) and publishes it as a release asset.
# Built natively inside rust:alpine so the binary runs on Alpine (musl)
# AND glibc — canora-sync's webhook-receiver/inspector-api are Alpine.
#
# Lives on the fork default branch (workflow_dispatch discoverability);
# checks out + builds the fix branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pnpm-prune-peer-variant-resolution

      - name: Build turbo (musl, native in rust:alpine)
        run: |
          docker run --rm -v "$PWD":/w -w /w rust:1-alpine sh -c '
            set -e
            apk add --no-cache musl-dev build-base capnproto protobuf-dev \
              openssl-dev openssl-libs-static perl make pkgconf git bash
            export OPENSSL_STATIC=1 OPENSSL_NO_VENDOR=1 RUSTFLAGS="-C target-feature=-crt-static"
            cargo build --release -p turbo
            ./target/release/turbo --version || true
          '

      - name: Publish musl binary as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp target/release/turbo dist/turbo-linux-x64-musl
          file dist/turbo-linux-x64-musl || true
          TAG="v0.0.0-canora-pnpmfix"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/turbo-linux-x64-musl \
            --title "turbo (linux x64, musl) — pnpm-prune peer-variant fix" \
            --notes "musl-static linux x64 turbo built from fix/pnpm-prune-peer-variant-resolution (vercel/turborepo#12819). Runs on Alpine (musl) and glibc. canora-sync fork-validation test asset; not for production."
