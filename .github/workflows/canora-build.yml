name: canora-build

# Builds a musl-static linux/amd64 `turbo` from the pnpm-prune peer-variant
# fix branch (vercel/turborepo#12819) and publishes it as a release asset.
#
# Build runs on ubuntu (apt's capnp/protoc work for the build scripts —
# proven by the earlier glibc build) and cross-targets
# x86_64-unknown-linux-musl via cargo-zigbuild, so the binary is fully
# static and runs on Alpine (canora-sync webhook-receiver/inspector-api)
# with no glibc/gcompat shim.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pnpm-prune-peer-variant-resolution

      - name: Host build tools + musl target + zig
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            capnproto protobuf-compiler pkg-config python3-pip
          rustup target add x86_64-unknown-linux-musl
          pipx install ziglang 2>/dev/null || pip3 install --user ziglang
          cargo install --locked cargo-zigbuild
          capnp --version

      - name: Build turbo (musl-static via zigbuild)
        env:
          # turbo's openssl-sys: build vendored so musl has no system openssl dep.
          OPENSSL_STATIC: "1"
          OPENSSL_NO_VENDOR: "0"
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p turbo
          file target/x86_64-unknown-linux-musl/release/turbo

      - name: Publish musl binary as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/turbo dist/turbo-linux-x64-musl
          dist/turbo-linux-x64-musl --version || true
          TAG="v0.0.0-canora-pnpmfix"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/turbo-linux-x64-musl \
            --title "turbo (linux x64, musl-static) — pnpm-prune peer-variant fix" \
            --notes "musl-static linux/amd64 turbo built (cargo-zigbuild) from fix/pnpm-prune-peer-variant-resolution (vercel/turborepo#12819). Runs on Alpine with no shim. canora-sync fork-validation test asset; not for production."
